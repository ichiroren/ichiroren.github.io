<script>
(function(){
  // Hide any board sync error messages
  const hideErrors = () => {
    document.querySelectorAll('div, span, p').forEach(el=>{
      const t = el.textContent || '';
      if(t.includes('Board sync') || t.includes('List failed') || t.includes('405 Not Allowed')){
        el.style.display='none';
        el.textContent='';
      }
    });
  };
  hideErrors();
  setTimeout(hideErrors, 500);
  setTimeout(hideErrors, 1500);
  
  // Make SEND buttons work without backend
  document.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    const txt = (btn.textContent||'').toUpperCase();
    if(txt.includes('SEND')){
      e.preventDefault();
      e.stopPropagation();
      const nameInput = document.querySelector('input[placeholder*="Your name"]');
      const name = nameInput ? nameInput.value : '';
      // Simple toast
      let toast = document.getElementById('custom-toast');
      if(!toast){
        toast = document.createElement('div');
        toast.id='custom-toast';
        toast.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0a0a0a;color:white;padding:14px 24px;border-radius:999px;font-size:14px;z-index:9999;border:1px solid #333;box-shadow:0 10px 30px rgba(0,0,0,0.3);';
        document.body.appendChild(toast);
      }
      toast.textContent = 'Thanks ' + (name||'there') + '! Please email mhirrow.deguzman@email.com — form is demo only';
      toast.style.display='block';
      setTimeout(()=>{ toast.style.display='none'; }, 4000);
      if(nameInput) nameInput.value='';
      const ideaInput = document.querySelector('input[placeholder*="Brief project idea"]');
      if(ideaInput) ideaInput.value='';
    }
  }, true);
})();
</script>
